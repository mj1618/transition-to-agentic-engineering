<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d2d2d"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#764ba2" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="termShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="docShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <marker id="loopArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#667eea"/>
    </marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e5c07b"/>
    </marker>
  </defs>

  <style>
    .cursor-blink {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .loop-dash {
      animation: dashMove 1.5s linear infinite;
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -20; }
    }
    .pulse-glow {
      animation: pulseGlow 3s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
    .flow-dash {
      animation: flowDash 1s linear infinite;
    }
    @keyframes flowDash {
      to { stroke-dashoffset: -12; }
    }
  </style>

  <!-- Background -->
  <rect width="900" height="600" fill="#f0f4f8"/>

  <!-- Title -->
  <text x="450" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#2d3748">The Simplest Agent</text>

  <!-- Decorative loop arc behind both panels -->
  <ellipse cx="250" cy="300" rx="250" ry="200" fill="none" stroke="url(#loopGrad)" stroke-width="2" stroke-dasharray="8,6" class="loop-dash" opacity="0.2"/>

  <!-- ========== TERMINAL (Left Side) ========== -->
  <!-- Glow behind terminal -->
  <rect x="20" y="80" width="430" height="320" rx="20" fill="url(#glowGrad)" class="pulse-glow"/>

  <!-- Terminal window -->
  <g filter="url(#termShadow)">
    <rect x="30" y="85" width="410" height="310" rx="12" fill="url(#termGrad)"/>
    <!-- Title bar -->
    <rect x="30" y="85" width="410" height="36" rx="12" fill="#3d3d3d"/>
    <rect x="30" y="109" width="410" height="12" fill="#3d3d3d"/>
    <!-- Traffic light buttons -->
    <circle cx="56" cy="103" r="7" fill="#ff5f57"/>
    <circle cx="78" cy="103" r="7" fill="#ffbd2e"/>
    <circle cx="100" cy="103" r="7" fill="#28ca41"/>
    <!-- Terminal title -->
    <text x="235" y="108" text-anchor="middle" font-family="monospace" font-size="12" fill="#999999">bash</text>
  </g>

  <!-- Code content -->
  <g transform="translate(65, 150)">
    <!-- Prompt symbol -->
    <text x="0" y="0" font-family="monospace" font-size="18" fill="#28ca41">$</text>

    <!-- Line 1: while -->
    <text x="25" y="0" font-family="monospace" font-size="18">
      <tspan fill="#c678dd">while</tspan>
      <tspan fill="#e0e0e0"> ;; </tspan>
      <tspan fill="#c678dd">do</tspan>
    </text>

    <!-- Line 2: cat PROMPT.md | claude -->
    <text x="0" y="38" font-family="monospace" font-size="18">
      <tspan fill="#e0e0e0">    </tspan>
      <tspan fill="#61afef">cat</tspan>
      <tspan fill="#e0e0e0"> </tspan>
      <tspan fill="#e5c07b" font-weight="bold">PROMPT.md</tspan>
      <tspan fill="#e0e0e0"> | </tspan>
      <tspan fill="#98c379">claude</tspan>
    </text>

    <!-- Line 3: done -->
    <text x="0" y="76" font-family="monospace" font-size="18">
      <tspan fill="#c678dd">done</tspan>
    </text>

    <!-- Blinking cursor -->
    <rect class="cursor-blink" x="52" y="62" width="11" height="20" fill="#28ca41" opacity="0.8"/>
  </g>

  <!-- Loop arrow on the left -->
  <g transform="translate(55, 280)">
    <path class="loop-dash" d="M 0 -70 A 70 70 0 1 0 -50 50" fill="none" stroke="url(#loopGrad)" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#loopArrow)" opacity="0.6"/>
    <text x="-25" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#667eea">&#8734;</text>
  </g>

  <!-- Annotation: "Your instructions" pointing to PROMPT.md in code -->
  <g transform="translate(115, 430)">
    <rect x="0" y="0" width="145" height="32" rx="8" fill="white" stroke="#e5c07b" stroke-width="2"/>
    <text x="72" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#92400e">Your instructions</text>
  </g>
  <line x1="188" y1="430" x2="220" y2="400" stroke="#e5c07b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Annotation: "The AI does the work" pointing to claude in code -->
  <g transform="translate(290, 430)">
    <rect x="0" y="0" width="150" height="32" rx="8" fill="white" stroke="#98c379" stroke-width="2"/>
    <text x="75" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2d6a2e">The AI does the work</text>
  </g>
  <line x1="365" y1="430" x2="345" y2="400" stroke="#98c379" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ========== PROMPT.MD PANEL (Right Side) ========== -->
  <g filter="url(#docShadow)">
    <!-- Document body -->
    <rect x="490" y="85" width="380" height="440" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Header bar -->
    <rect x="490" y="85" width="380" height="40" rx="12" fill="#fffbeb"/>
    <rect x="490" y="113" width="380" height="12" fill="#fffbeb"/>
    <!-- Header bottom border -->
    <line x1="490" y1="125" x2="870" y2="125" stroke="#e5c07b" stroke-width="1.5"/>
    <!-- File icon -->
    <g transform="translate(508, 94)">
      <rect x="0" y="0" width="16" height="20" rx="2" fill="none" stroke="#92400e" stroke-width="1.5"/>
      <path d="M 10 0 L 10 6 L 16 6" fill="none" stroke="#92400e" stroke-width="1.5"/>
      <line x1="4" y1="10" x2="12" y2="10" stroke="#92400e" stroke-width="1"/>
      <line x1="4" y1="14" x2="10" y2="14" stroke="#92400e" stroke-width="1"/>
    </g>
    <!-- Filename -->
    <text x="532" y="110" font-family="monospace" font-size="14" font-weight="bold" fill="#92400e">PROMPT.md</text>
  </g>

  <!-- PROMPT.md content area -->
  <g transform="translate(510, 140)">
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="15" fill="#2d3748">
      <tspan x="20" dy="0" font-weight="bold">You're building Facebook in the</tspan>
      <tspan x="20" dy="24" font-weight="bold">current folder.</tspan>
      <tspan x="20" dy="36">Use NextJS+convex.</tspan>
      <tspan x="20" dy="36">Track task status under</tspan>
      <tspan x="20" dy="24" font-family="monospace" font-size="14" fill="#667eea">./tasks/</tspan>
      <tspan x="20" dy="36">Test your work using</tspan>
      <tspan x="20" dy="24" font-family="monospace" font-size="14" fill="#667eea">playwright-cli</tspan>
    </text>
  </g>

  <!-- Flow arrow from PROMPT.md panel to terminal cat command -->
  <path class="flow-dash" d="M 490 200 C 470 200, 460 192, 445 190" fill="none" stroke="#e5c07b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#flowArrow)"/>

  <!-- Subtitle -->
  <text x="450" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#718096">Feed instructions, let the model execute, repeat forever</text>
</svg>
