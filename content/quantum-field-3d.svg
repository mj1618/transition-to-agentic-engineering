<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#000010"/>
    </radialGradient>

    <!-- Central object glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#88ddff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#4488ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2244aa" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer energy halo -->
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#66ccff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#4488ff" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#aa44ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff44aa" stop-opacity="0"/>
    </radialGradient>

    <!-- Field line gradient -->
    <linearGradient id="fieldLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2244aa" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#66aaff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2244aa" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Particle glow filter -->
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow -->
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
    </filter>

    <!-- Field distortion filter -->
    <filter id="fieldDistort" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Distant star field -->
  <g opacity="0.4">
    <circle cx="100" cy="80" r="1" fill="#ffffff"/>
    <circle cx="250" cy="150" r="0.8" fill="#aaccff"/>
    <circle cx="950" cy="100" r="1.2" fill="#ffffff"/>
    <circle cx="1100" cy="200" r="0.7" fill="#ccddff"/>
    <circle cx="180" cy="650" r="0.9" fill="#ffffff"/>
    <circle cx="1050" cy="600" r="1" fill="#aabbff"/>
    <circle cx="80" cy="400" r="0.8" fill="#ffffff"/>
    <circle cx="1130" cy="420" r="1.1" fill="#ccccff"/>
    <circle cx="350" cy="50" r="0.6" fill="#ffffff"/>
    <circle cx="750" cy="720" r="0.9" fill="#aaccff"/>
    <circle cx="400" cy="750" r="0.7" fill="#ffffff"/>
    <circle cx="900" cy="60" r="1" fill="#ddddff"/>
  </g>

  <!-- 3D Grid - Back horizontal lines (receding into distance) -->
  <g stroke="#3355aa" stroke-width="0.5" fill="none" opacity="0.3">
    <!-- Back grid lines - horizontal (z-depth) -->
    <path d="M 200,200 Q 600,190 1000,200" stroke-opacity="0.2"/>
    <path d="M 180,240 Q 600,225 1020,240" stroke-opacity="0.25"/>
    <path d="M 160,280 Q 600,260 1040,280" stroke-opacity="0.3"/>
    <path d="M 140,320 Q 600,295 1060,320" stroke-opacity="0.35"/>
    <path d="M 120,360 Q 600,335 1080,360" stroke-opacity="0.4"/>
  </g>

  <!-- 3D Quantum Field Grid - Main perspective grid -->
  <g stroke="url(#fieldLineGrad)" fill="none" opacity="0.7">
    <!-- Horizontal field lines with wave distortion near center -->
    <path d="M 50,440 Q 300,440 450,435 C 520,420 560,380 600,370 C 640,380 680,420 750,435 Q 900,440 1150,440" stroke-width="0.8" stroke="#4477cc" stroke-opacity="0.5"/>
    <path d="M 30,480 Q 280,480 430,472 C 510,450 560,410 600,395 C 640,410 690,450 770,472 Q 920,480 1170,480" stroke-width="1" stroke="#5588dd" stroke-opacity="0.6"/>
    <path d="M 20,520 Q 260,520 410,508 C 500,480 555,440 600,420 C 645,440 700,480 790,508 Q 940,520 1180,520" stroke-width="1.2" stroke="#6699ee" stroke-opacity="0.7"/>
    <path d="M 10,560 Q 240,560 390,545 C 490,510 550,465 600,445 C 650,465 710,510 810,545 Q 960,560 1190,560" stroke-width="1.3" stroke="#6699ee" stroke-opacity="0.7"/>
    <path d="M 0,600 Q 220,600 370,585 C 480,550 545,500 600,480 C 655,500 720,550 830,585 Q 980,600 1200,600" stroke-width="1.4" stroke="#5588dd" stroke-opacity="0.6"/>
    <path d="M -10,640 Q 200,640 350,628 C 470,595 540,545 600,525 C 660,545 730,595 850,628 Q 1000,640 1210,640" stroke-width="1.2" stroke="#4477cc" stroke-opacity="0.5"/>
    <path d="M -20,680 Q 180,680 330,670 C 460,645 535,600 600,580 C 665,600 740,645 870,670 Q 1020,680 1220,680" stroke-width="1" stroke="#3366bb" stroke-opacity="0.4"/>
    <path d="M -30,720 Q 160,720 310,712 C 450,692 530,655 600,640 C 670,655 750,692 890,712 Q 1040,720 1230,720" stroke-width="0.8" stroke="#2255aa" stroke-opacity="0.3"/>
  </g>

  <!-- Vertical field lines with perspective convergence -->
  <g stroke="#5588cc" fill="none" opacity="0.5">
    <path d="M 200,200 C 200,350 195,500 190,750" stroke-width="0.6" stroke-opacity="0.3"/>
    <path d="M 300,195 C 300,340 290,480 280,750" stroke-width="0.7" stroke-opacity="0.35"/>
    <path d="M 400,192 C 400,330 385,460 370,750" stroke-width="0.8" stroke-opacity="0.4"/>
    <path d="M 500,190 C 498,310 480,420 470,750" stroke-width="0.9" stroke-opacity="0.5"/>
    <path d="M 560,189 C 555,300 540,390 535,750" stroke-width="1" stroke-opacity="0.55"/>
    <path d="M 600,188 C 600,280 600,370 600,750" stroke-width="1.2" stroke-opacity="0.6"/>
    <path d="M 640,189 C 645,300 660,390 665,750" stroke-width="1" stroke-opacity="0.55"/>
    <path d="M 700,190 C 702,310 720,420 730,750" stroke-width="0.9" stroke-opacity="0.5"/>
    <path d="M 800,192 C 800,330 815,460 830,750" stroke-width="0.8" stroke-opacity="0.4"/>
    <path d="M 900,195 C 900,340 910,480 920,750" stroke-width="0.7" stroke-opacity="0.35"/>
    <path d="M 1000,200 C 1000,350 1005,500 1010,750" stroke-width="0.6" stroke-opacity="0.3"/>
  </g>

  <!-- Field energy ripples radiating from center -->
  <g fill="none" stroke="#6699ff" opacity="0.3">
    <ellipse cx="600" cy="450" rx="80" ry="40" stroke-width="1.5" stroke-opacity="0.6">
      <animate attributeName="rx" values="80;120;160;200" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="40;60;80;100" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;0.4;0.2;0" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="600" cy="450" rx="120" ry="60" stroke-width="1.2" stroke-opacity="0.4">
      <animate attributeName="rx" values="120;160;200;240" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="60;80;100;120" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.4;0.3;0.15;0" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="600" cy="450" rx="160" ry="80" stroke-width="1" stroke-opacity="0.3">
      <animate attributeName="rx" values="160;200;240;280" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="80;100;120;140" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.3;0.2;0.1;0" dur="4s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Quantum fluctuation particles -->
  <g filter="url(#glowFilter)">
    <circle cx="480" cy="420" r="2" fill="#88ccff" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="420;415;420" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="470" r="1.8" fill="#aa88ff" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="720;725;720" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="510" r="1.5" fill="#88ffcc" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="380" r="2.2" fill="#ffaa88" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="380;375;380" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="500" r="1.3" fill="#88aaff" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="770" cy="520" r="1.7" fill="#cc88ff" opacity="0.55">
      <animate attributeName="opacity" values="0.55;0.1;0.55" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="510" cy="360" r="1.4" fill="#88ffaa" opacity="0.45">
      <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="690" cy="550" r="1.6" fill="#ffcc88" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Energy halo around central object -->
  <ellipse cx="600" cy="450" rx="140" ry="70" fill="url(#haloGrad)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.4;0.6" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Central object - glowing sphere with 3D shading -->
  <g filter="url(#softGlow)">
    <circle cx="600" cy="400" r="60" fill="#4488ff" opacity="0.3"/>
  </g>

  <!-- Sphere body -->
  <circle cx="600" cy="400" r="45" fill="#0a1530"/>
  <circle cx="600" cy="400" r="45" fill="url(#coreGlow)" opacity="0.9"/>

  <!-- Sphere highlight -->
  <ellipse cx="585" cy="385" rx="18" ry="14" fill="#ffffff" opacity="0.3"/>
  <ellipse cx="582" cy="382" rx="8" ry="6" fill="#ffffff" opacity="0.6"/>

  <!-- Sphere ring / orbit -->
  <ellipse cx="600" cy="400" rx="65" ry="20" fill="none" stroke="#88ccff" stroke-width="1.5" opacity="0.6" transform="rotate(-15, 600, 400)">
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="600" cy="400" rx="70" ry="25" fill="none" stroke="#aa66ff" stroke-width="1" opacity="0.4" transform="rotate(25, 600, 400)">
    <animate attributeName="opacity" values="0.4;0.2;0.4" dur="2.5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Field distortion lines near object -->
  <g stroke="#77aaff" fill="none" opacity="0.4" filter="url(#fieldDistort)">
    <path d="M 500,350 C 530,360 545,380 555,400 C 545,420 530,440 500,450" stroke-width="0.8"/>
    <path d="M 700,350 C 670,360 655,380 645,400 C 655,420 670,440 700,450" stroke-width="0.8"/>
    <path d="M 550,320 C 565,340 575,370 580,400 C 575,430 565,460 550,480" stroke-width="0.6"/>
    <path d="M 650,320 C 635,340 625,370 620,400 C 625,430 635,460 650,480" stroke-width="0.6"/>
  </g>

  <!-- Vertical energy beam from object -->
  <g opacity="0.25">
    <line x1="600" y1="400" x2="600" y2="100" stroke="#88ccff" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="600" y1="400" x2="600" y2="750" stroke="#88ccff" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Explanatory text -->
  <text x="600" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ccddff" opacity="0.9">Quantum Field Excitation</text>

  <!-- Label: Central particle -->
  <g opacity="0.8">
    <line x1="660" y1="370" x2="780" y2="300" stroke="#88aacc" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="790" y="295" font-family="Arial, sans-serif" font-size="14" fill="#99bbdd">Particle (field excitation)</text>
    <text x="790" y="313" font-family="Arial, sans-serif" font-size="11" fill="#7799bb">Localised energy in the field</text>
  </g>

  <!-- Label: Field lines -->
  <g opacity="0.8">
    <line x1="350" y1="550" x2="200" y2="580" stroke="#88aacc" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="80" y="575" font-family="Arial, sans-serif" font-size="14" fill="#99bbdd">Quantum field (vacuum state)</text>
    <text x="80" y="593" font-family="Arial, sans-serif" font-size="11" fill="#7799bb">Permeates all of space</text>
  </g>

  <!-- Label: Ripples -->
  <g opacity="0.8">
    <line x1="750" y1="500" x2="880" y2="550" stroke="#88aacc" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="890" y="545" font-family="Arial, sans-serif" font-size="14" fill="#99bbdd">Field disturbance</text>
    <text x="890" y="563" font-family="Arial, sans-serif" font-size="11" fill="#7799bb">Ripples propagate as waves</text>
  </g>

  <!-- Label: Virtual particles -->
  <g opacity="0.8">
    <line x1="430" y1="360" x2="280" y2="310" stroke="#88aacc" stroke-width="0.8" stroke-dasharray="4,3"/>
    <text x="120" y="305" font-family="Arial, sans-serif" font-size="14" fill="#99bbdd">Virtual particles</text>
    <text x="120" y="323" font-family="Arial, sans-serif" font-size="11" fill="#7799bb">Quantum fluctuations</text>
  </g>

  <!-- Bottom description -->
  <text x="600" y="770" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#6688aa" opacity="0.7">A particle is not a separate entity - it is an excitation (vibration) of the underlying quantum field</text>
</svg>