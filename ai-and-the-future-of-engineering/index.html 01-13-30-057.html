<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI and the Future of Engineering</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
      color: #e0e0e0;
      min-height: 100vh;
      overflow: hidden;
    }

    .slide {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 40px;
    }

    .slide.active {
      display: flex;
    }

    .slide img {
      max-width: 90vw;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .slide iframe,
    .slide .twitter-tweet {
      max-width: 90vw;
      max-height: 80vh;
    }

    .title-slide h1 {
      font-size: clamp(2rem, 6vw, 5rem);
      font-weight: 700;
      text-align: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      margin-bottom: 20px;
    }

    .title-slide .subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.2rem;
      color: #888;
      margin-top: 20px;
    }

    .thank-you h1 {
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 700;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #ff6b6b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Gallery styles */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      max-width: 90vw;
      max-height: 80vh;
      overflow: auto;
      padding: 20px;
    }

    .gallery img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border-radius: 8px;
    }

    .gallery img:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.95);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      cursor: pointer;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
    }

    /* Navigation */
    .nav {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 100;
    }

    .nav button {
      font-family: 'Space Grotesk', sans-serif;
      padding: 12px 30px;
      font-size: 1rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .nav button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }

    .nav button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }

    .progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
      transition: width 0.3s ease;
      z-index: 100;
    }

    .slide-counter {
      position: fixed;
      top: 20px;
      right: 30px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      color: #666;
      z-index: 100;
    }

    /* Embed container */
    .embed-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 400px;
    }
  </style>
</head>

<body>
  <div class="progress" id="progress"></div>
  <div class="slide-counter" id="counter"></div>

  <!-- Title Slide -->
  <div class="slide title-slide active" data-index="0">

  </div>

  <!-- 01 - Autonomy Threshold -->

  <!-- 02a - Browser Testing Tweet -->

    <div class="embed-container">

            href="https://t.co/orXqgVoem8">pic.twitter.com/orXqgVoem8</a></p>&mdash; Maestro (@maestro__dev) <a
          href="https://twitter.com/maestro__dev/status/2017975473641308352?ref_src=twsrc%5Etfw">February 1, 2026</a>
      </blockquote>

  </div>

  <!-- 03b - Context Degradation -->

  <!-- 04 - Ralph -->

  <div class="slide" data-index="7">

  <!-- 07 - Context Crafting -->
  <div class="slide" data-index="8">
    <img src="07-context-crafting.svg" alt="Context Crafting">

  <!-- 08 - Engineering Enablement -->
  <div class="slide" data-index="9">

      <img src="09b-moltbook.webp" alt="Moltbook" onclick="openLightbox(this.src)">

      <img src="09d-moltbook.png" alt="Moltbook" onclick="openLightbox(this.src)">
      <img src="09e-moltbook.jpeg" alt="Moltbook" onclick="openLightbox(this.src)">

  </div>

  <!-- 10 - Various Gallery -->
  <div class="slide" data-index="11">
    <div class="gallery">
      <img src="10a-church-of-molt.png" alt="Church of Molt" onclick="openLightbox(this.src)">
      <img src="10b-moltcity.png" alt="Moltcity" onclick="openLightbox(this.src)">
      <img src="10c-moltmatch.png" alt="Moltmatch" onclick="openLightbox(this.src)">
      <img src="10d-molthub.png" alt="Molthub" onclick="openLightbox(this.src)">
      <img src="10e-molthub.png" alt="Molthub" onclick="openLightbox(this.src)">
      <img src="10f-rentahuman.png" alt="Rent a Human" onclick="openLightbox(this.src)">
      <img src="10g-rentahuman.png" alt="Rent a Human" onclick="openLightbox(this.src)">
    </div>
  </div>

  <!-- 11 - LinkedIn Gallery -->
  <div class="slide" data-index="12">
    <div class="gallery">
      <img src="11a-linkedin.png" alt="LinkedIn" onclick="openLightbox(this.src)">
      <img src="11b-linkedin.png" alt="LinkedIn" onclick="openLightbox(this.src)">
      <img src="11c-linkedin.png" alt="LinkedIn" onclick="openLightbox(this.src)">
      <img src="11d-linkedin.png" alt="LinkedIn" onclick="openLightbox(this.src)">
      <img src="11e-linkedin.png" alt="LinkedIn" onclick="openLightbox(this.src)">
      <img src="11f-linkedin.png" alt="LinkedIn" onclick="openLightbox(this.src)">
      <img src="11g-linkedin.png" alt="LinkedIn" onclick="openLightbox(this.src)">
    </div>
  </div>

  <!-- 12 - Engineer Value -->
  <div class="slide" data-index="13">
    <img src="12-engineer-value.svg" alt="Engineer Value">
  </div>

  <!-- Thank You Slide -->
  <div class="slide thank-you" data-index="14">
    <h1>Thank You</h1>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Enlarged image">
  </div>

  <!-- Navigation -->
  <div class="nav">
    <button id="prevBtn" onclick="prevSlide()">&#8592; Previous</button>
    <button id="nextBtn" onclick="nextSlide()">Next &#8594;</button>
  </div>

  <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>

  <script>
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    const totalSlides = slides.length;
    const progress = document.getElementById('progress');
    const counter = document.getElementById('counter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const lightbox = document.getElementById('lightbox');

    function updateSlide() {
      slides.forEach((slide, index) => {
        slide.classList.toggle('active', index === currentSlide);
      });

      progress.style.width = ((currentSlide + 1) / totalSlides * 100) + '%';
      counter.textContent = `${currentSlide + 1} / ${totalSlides}`;

      prevBtn.disabled = currentSlide === 0;
      nextBtn.disabled = currentSlide === totalSlides - 1;
    }

    function nextSlide() {
      if (currentSlide < totalSlides - 1) {
        currentSlide++;
        updateSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        updateSlide();
      }
    }

    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (lightbox.classList.contains('active')) {
        if (e.key === 'Escape' || e.key === ' ') {
          closeLightbox();
        }
        return;
      }

      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        prevSlide();
      } else if (e.key === 'Escape') {
        closeLightbox();
      }
    });

    // Initialize
    updateSlide();
  </script>
</body>

</html>
